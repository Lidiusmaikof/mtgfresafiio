# =============================================================================
# EFECTOS AL NACER: DESPERTAR DEL CHILLADOR
# =============================================================================
NacimientoOscuro:
  Skills:
    # Alarido sónico del catalizador y latidos del corazón del Warden
    - sound{sound=block.sculk_shrieker.shriek;volume=2;pitch=0.6} @Self
    - sound{sound=entity.warden.heartbeat;volume=2;pitch=0.5} @Self
    # Estallido visual: Almas liberadas y ondas de expansión sónica
    - particles{particle=sculk_soul;amount=40;speed=0.1;hS=1.5;vS=1.5} @Self
    - particles{particle=sonic_boom;amount=1;speed=0;hS=0;vS=0} @Self
    # Maldición ciega instantánea a los jugadores cercanos al nacer
    - potion{type=DARKNESS;duration=140;lvl=1} @PlayersInRadius{r=15}

# =============================================================================
# AURA PASIVA: SENSORES DE MOVIMIENTO ACTIVOS
# =============================================================================
AuraOscuraConstante:
  Skills:
    # Partículas de carga Sculk que fluyen por sus cuerpos
    - particles{particle=sculk_charge;amount=4;speed=0.01;hS=0.5;vS=1} @Self
    # Crujido constante de los tentáculos sensitivos del Warden
    - sound{sound=entity.warden.tendril_clicks;volume=0.5;pitch=0.8} @Self ~onTimer:40

# =============================================================================
# COMBATE 1: GOLPE RESONANTE (MELEE - MOLDE MAESTRO)
# =============================================================================
GolpeResonante:
  Skills:
    - sound{sound=entity.warden.attack_impact;volume=1.3;pitch=0.6} @Target
    - particles{particle=sculk_soul;amount=15;speed=0.1;hS=0.5;vS=0.5} @Target
    - potion{type=SLOW;duration=60;lvl=4} @Target                               # Mantiene: Lentitud IV por 3s
    - potion{type=DARKNESS;duration=100;lvl=1} @Target                          # Inyecta oscuridad absoluta al recibir el golpe
    - damage{amount=4;ignoreArmor=true} @Target                                 # Mantiene: 4 de daño verdadero

# =============================================================================
# COMBATE 2: ATAQUE SÓNICO (RANGED - ARTILLERÍA)
# =============================================================================
AtaqueSonico:
  Skills:
    # Réplica exacta del ataque sónico del Warden
    - sound{sound=entity.warden.sonic_boom;volume=1.5;pitch=1} @Target
    - particles{particle=sonic_boom;amount=1;speed=0;hS=0;vS=0} @Target
    - damage{amount=6;ignoreArmor=true} @Target                                 # Daño de perforación sónica
    - potion{type=WITHER;duration=60;lvl=2} @Target                             # Desintegración por almas

# =============================================================================
# EFECTO DE NÚCLEO ACTIVO: NIEBLA DE LAS ALMAS ATRAPADAS
# =============================================================================
EfectoCoreDeepDark:
  Skills:
    # Latido sordo que reverbera en las paredes de la cueva
    - sound{sound=entity.warden.heartbeat;volume=1.4;pitch=0.4} @Self
    # Vórtice visual de tinta de calamar (emula sombras), almas y partículas sculk
    - particles{particle=sculk_soul;amount=25;speed=0.02;hS=2.5;vS=2.5} @Self
    - particles{particle=sculk_charge;amount=20;speed=0.04;hS=3;vS=1} @Self
    - particles{particle=squid_ink;amount=15;speed=0.01;hS=2;vS=2} @Self        # Nube de partículas oscuras