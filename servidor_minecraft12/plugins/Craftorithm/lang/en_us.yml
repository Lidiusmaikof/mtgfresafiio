prefix: '&8[&3Craftorithm&8]'
unsupported_version: <prefix> Unsupported Version
new_version: <prefix> &aDetected a new version <new_version>, please update to the
  latest version promptly!
# 使用命令的一些反馈消息
command:
  no_perm: <prefix> &cYou do not have permission to use this command.
  player_only: <prefix> &cOnly players can execute this command.
  not_enough_param: <prefix> &cThe Command is missing parameters, <number> parameters
    required.
  undefined_subcmd: <prefix> &cUndefined subcommand!
  item:
    save:
      success: <prefix> &aItem saved successfully.
      failed_save_air: '<prefix> &cItem save failed. Reason: Cannot save a non-existent
        item.'
    give:
      success: <prefix> &aGive item successfully
      not_exist_item: <prefix> &cItem <item_name> does not exist.
      player_offline: <prefix> &cThe player is not online or does not have a profile.
    fuel:
      add:
        success: <prefix> &aAdd custom fuel successfully.
        failed_add_air: '<prefix> &cAdd custom fuel failed. Reason: Cannot add a non-existent
          item as fuel.'
        failed_exist: '<prefix> &cAdd custom fuel failed. Reason: This fuel already
          exists.'
      remove:
        success: <prefix> &aRemove custom fuel successfully.
        failed_not_exist: '<prefix> &cRemove custom fuel failed. Reason: This fuel
          does not exist.'
  reload:
    success: <prefix> &aPlugin reload!
    exception: <prefix> &cError occurred during plugin reload, please check the console.
    recipes_confirm: <prefix> &eConfirm reloading recipes? If there are many recipes
      or many players online, it may cause server overload!
    recipes: <prefix> &aRecipes reloaded!
    recipe_manager_reloading: <prefix> &cRecipe manager is currently reloading, please
      try again later.
  remove:
    success: <prefix> &aRecipe removed successfully.
    not_exist: <prefix> &cRecipe does not exist.
  disable:
    success: <prefix> &cRecipe disabled successfully.
    not_exist: <prefix> &cRecipe does not exist or has already been disabled.
    failed: <prefix> &cFailed to disable recipe, it may already be disabled or does
      not exist.
  version: '<prefix> &aPlugin version: <version>'
  create:
    unsupported_recipe_type: <prefix> &cUnsupported recipe type.
    unsupported_recipe_name: <prefix> &cUnsupported recipe name, only lowercase letters,
      numbers, "_", "-", and "." are allowed.
    name_used: <prefix> &cRecipe ID has already been used.
    null_result: <prefix> &cRecipe result cannot be empty!
    null_source: <prefix> &cRecipe ingredients cannot be empty!
    success: <prefix> &a<recipe_type> recipe <recipe_name> created successfully.
    invalid_recipe_id: <prefix> &cUnsupported recipe name, only lowercase letters,
      numbers, "_", "-", and "." are allowed.
    input_hint:
      smelting_time: '&aPlease enter the smelting time for this recipe (type cancel
        to cancel)'
      smelting_exp: '&aPlease enter the reward experience for this recipe (type cancel
        to cancel)'
      anvil_cost_level: '&aPlease enter the experience cost for this anvil recipe
        (type cancel to cancel)'
  run_arcenciel:
    success: <prefix> &aExecution successful, took <time> ms.
  list:
    unsupported_version: <prefix> &cThis feature is only available in version 1.16
      and above.
  unknown_player: '<prefix> &cUnknown player: <player_name>'
  display:
    unsupported_recipe_type: <prefix> &cUnsupported recipe type.
  openmenu:
    unknown_menu: '<prefix> &cUnknown menu: <menu_name>'
  script:
    operation_time: <prefix> &aStatement execution took <time> ms.
  edit:
    invalid_recipe_id: <prefix> &cInvalid recipe ID.
    recipe_not_found: <prefix> &cRecipe not found.
    success: <prefix> &aRecipe <recipe_file_name> (<recipe_id>) edited successfully.
  recipebook:
    success: <prefix> &aRecipe book opened.
    type_not_found: <prefix> &cRecipe type <recipe_type> does not exist.
