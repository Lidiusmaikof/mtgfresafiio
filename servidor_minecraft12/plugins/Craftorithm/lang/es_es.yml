  a la versión más reciente lo antes posible!
# Mensajes de retroalimentación del uso de comandos
command:
  no_perm: <prefix> &cNo tienes permiso para usar este comando.
  player_only: <prefix> &cSolo los jugadores pueden ejecutar este comando.
  not_enough_param: <prefix> &cEl comando necesita parámetros, se requieren <number>
    parámetros.
  undefined_subcmd: <prefix> &cSubcomando no definido!
  item:
    save:
      success: <prefix> &aElemento guardado con éxito.
      failed_save_air: '<prefix> &cError al guardar el elemento. Motivo: No se puede
        guardar un elemento inexistente.'
    give:
      success: <prefix> &aElemento entregado con éxito
      not_exist_item: <prefix> &cEl elemento <item_name> no existe.
      player_offline: <prefix> &cEl jugador no está en línea o no tiene un perfil.
    fuel:
      add:
        success: <prefix> &aCombustible personalizado añadido con éxito.
        failed_add_air: '<prefix> &cError al añadir combustible personalizado. Motivo:
          No se puede añadir un elemento inexistente como combustible.'
        failed_exist: '<prefix> &cError al añadir combustible personalizado. Motivo:
          Este combustible ya existe.'
      remove:
        success: <prefix> &aCombustible personalizado eliminado con éxito.
        failed_not_exist: '<prefix> &cError al eliminar combustible personalizado.
          Motivo: Este combustible no existe.'
  reload:
    success: <prefix> &a¡Plugin recargado!
    exception: <prefix> &cSe produjo un error durante la recarga del plugin, por favor
      revisa la consola.
    recipe_manager_reloading: <prefix> &cEl gestor de recetas se está recargando.
      Por favor, inténtalo de nuevo más tarde.
  remove:
    success: <prefix> &aReceta eliminada con éxito.
    not_exist: <prefix> &cLa receta no existe.
  disable:
    success: <prefix> &cReceta deshabilitada con éxito.
    not_exist: <prefix> &cLa receta no existe o ya ha sido deshabilitada.
    failed: <prefix> &cError al deshabilitar la receta, puede que ya esté deshabilitada
      o no exista.
  version: '<prefix> &aVersión del plugin: <version>'
  create:
    unsupported_recipe_type: <prefix> &cTipo de receta no soportado.
    unsupported_recipe_name: <prefix> &cNombre de receta no soportado, solo se permiten
      letras minúsculas, números, "_", "-" y ".".
    name_used: <prefix> &cEl ID de la receta ya está en uso.
    null_result: <prefix> &cEl resultado de la receta no puede estar vacío!
    null_source: <prefix> &cLos ingredientes de la receta no pueden estar vacíos!
    success: <prefix> &aReceta <recipe_type> <recipe_name> creada con éxito.
    invalid_recipe_id: <prefix> &cNombre de receta no soportado. Solo se permiten
      letras minúsculas, números, "_", "-" y ".".
    input_hint:
      smelting_time: '&aIntroduce el tiempo de fundición para esta receta (escribe
        cancel para cancelar)'
      smelting_exp: '&aIntroduce la experiencia de recompensa para esta receta (escribe
        cancel para cancelar)'
      anvil_cost_level: '&aIntroduce el costo en experiencia para esta receta de yunque
        (escribe cancel para cancelar)'
  run_arcenciel:
