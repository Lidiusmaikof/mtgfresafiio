# =============================================================================
# JINETE 1: TRITÓN DE LAS MAREAS (VERSION MAESTRA DEFINITIVA)
# =============================================================================
TritonMareas:
  Type: DROWNED
  Display: '&3&lTritón de las Mareas'
  Health: 50
  Damage: 5
  Faction: OceanAbyss
  Options:
    AlwaysShowName: true
    MovementSpeed: 0.25
    PreventSunburn: true         # Blindado si sale a la superficie
    KnockbackResistance: 0.5
  AIGoalSelectors:
    - clear
    - meleeattack                # Concentrado puramente en atacar desde su montura
    - wander
  AITargetSelectors:
    - clear
    - players
    - attacker
  Equipment:
    - diamond_chestplate CHEST
    - diamond_boots BOOTS
    - trident HAND
  Skills:
    - skill{s=GarantizarMontura} @Self ~onSpawn
    - skill{s=EfectoNacimientoOceanico} @Self ~onSpawn
    - skill{s=AuraAmbienteOceanica} @Self ~onTimer:30
    - skill{s=PresionAbisal} @Target ~onAttack

# =============================================================================
# JINETE 2: BRUJA DEL ARRECIFE (VERSION MAESTRA DEFINITIVA)
# =============================================================================
