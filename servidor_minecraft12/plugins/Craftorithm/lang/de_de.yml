prefix: '&8[&3Craftorithm&8]'
unsupported_version: <prefix> Nicht unterstützte Version
new_version: <prefix> &aEs wurde eine neue Version <new_version> erkannt. Bitte aktualisieren
  Sie rechtzeitig auf die neue Version!
# 使用命令的一些反馈消息
command:
  no_perm: <prefix> &cSie haben keine Berechtigung, diesen Befehl zu verwenden.
  player_only: <prefix> &cNur Spieler können diesen Befehl ausführen.
  not_enough_param: <prefix> &cBefehl fehlt Parameter, es fehlen <number> Parameter
  undefined_subcmd: <prefix> &cUndefinierter Unterbefehl
  item:
    save:
      success: <prefix> &aGegenstand erfolgreich gespeichert.
      failed_save_air: '<prefix> &cGegenstand konnte nicht gespeichert werden. Grund:
        Gegenstand, der nicht existiert, kann nicht gespeichert werden.'
    give:
      success: <prefix> &aGegenstand erfolgreich erhalten.
      not_exist_item: <prefix> &cGegenstand <item_name> existiert nicht.
      player_offline: <prefix> &cDer Spieler ist nicht online oder existiert nicht.
    fuel:
      add:
        success: <prefix> &aBenutzerdefinierten Kraftstoff erfolgreich hinzufügen.
        failed_add_air: '<prefix> &cDas Hinzufügen des benutzerdefinierten Kraftstoffs
          ist fehlgeschlagen. Grund: Ein nicht vorhandener Artikel kann nicht als
          Treibstoff hinzugefügt werden.'
        failed_exist: '<prefix> &cDas Hinzufügen des benutzerdefinierten Kraftstoffs
          ist fehlgeschlagen. Grund: Dieser Kraftstoff existiert bereits.'
      remove:
        success: <prefix> &aBenutzerdefinierten Kraftstoff erfolgreich entfernen.
        failed_not_exist: '<prefix> &cDas Entfernen des benutzerdefinierten Kraftstoffs
          ist fehlgeschlagen. Grund: Dieser Kraftstoff existiert nicht.'
  reload:
    success: <prefix> &aDas Plugin wurde erfolgreich neu geladen.
    exception: <prefix> &cBeim Neuladen des Plugins ist ein Fehler aufgetreten. Bitte
      überprüfen Sie die Konsole.
    recipe_manager_reloading: <prefix> &cDer Rezeptmanager wird gerade neu geladen.
      Bitte versuche es später erneut.
  remove:
    success: <prefix> &aRezept erfolgreich gelöscht.
    not_exist: <prefix> &cRezept existiert nicht.
  disable:
    success: <prefix> &cRezept erfolgreich deaktiviert.
    not_exist: <prefix> &cDas Rezept existiert nicht oder wurde bereits deaktiviert.
    failed: <prefix> &cFehler beim Deaktivieren des Rezepts. Möglicherweise wurde
      es bereits deaktiviert oder existiert nicht.
  version: '<prefix> &aPlugin Version: <version>'
  create:
    unsupported_recipe_type: <prefix> &cNicht unterstützter Rezepttyp
    unsupported_recipe_name: <prefix> &cNicht unterstützter Rezeptname, es sind nur
      Kleinbuchstaben, Zahlen, "_", "-", und "." zulässig.
    name_used: <prefix> &cRezept-ID ist bereits vergeben.
    null_result: <prefix> &cDas Rezeptergebnis darf nicht leer sein!
    null_source: <prefix> &cDie Rezeptzutaten dürfen nicht leer sein!
    success: <prefix> &a<recipe_type>-Rezept <recipe_name> erfolgreich erstellt.
    invalid_recipe_id: <prefix> &cNicht unterstützter Rezeptname. Es sind nur Kleinbuchstaben,
      Ziffern, "_", "-" und "." erlaubt.
    input_hint:
      smelting_time: '&aBitte gib die Schmelzzeit für dieses Rezept ein (cancel zum
        Abbrechen)'
      smelting_exp: '&aBitte gib die Erfahrungsbelohnung für dieses Rezept ein (cancel
        zum Abbrechen)'
      anvil_cost_level: '&aBitte gib die erforderlichen Erfahrungspunkte für dieses
        Amboss-Rezept ein (cancel zum Abbrechen)'
  run_arcenciel:
    success: <prefix> &aErfolgreich ausgeführt, dauerte <time> ms.
  list:
    unsupported_version: <prefix> &cDiese Funktion ist nur in Version 1.16 und höher
      verfügbar.
  unknown_player: '<prefix> &cUnbekannter Spieler: <player_name>'
  display:
    unsupported_recipe_type: <prefix> &cNicht unterstützter Rezepttyp.
  openmenu:
    unknown_menu: '<prefix> &cUnbekanntes Menü: <menu_name>'
  script:
    operation_time: <prefix> &aAusführung der Anweisung dauerte <time> ms.
  edit:
    invalid_recipe_id: <prefix> &cUngültige Rezept-ID.
    recipe_not_found: <prefix> &cRezept nicht gefunden.
    success: <prefix> &aRezept <recipe_file_name> (<recipe_id>) erfolgreich bearbeitet.
  recipebook:
    success: <prefix> &aRezeptbuch geöffnet.
    type_not_found: <prefix> &cRezepttyp <recipe_type> existiert nicht
