      success: <prefix> &aПредмет успешно получен.
      not_exist_item: <prefix> &cПредмет <item_name> не существует.
      player_offline: <prefix> &cЭтот игрок офлайн или не существует.
    fuel:
      add:
        success: <prefix> &aДобавить собственное топливо успешно.
        failed_add_air: '<prefix> &cНе удалось добавить собственное топливо. Причина:
          Невозможно добавить несуществующий предмет в качестве топлива.'
        failed_exist: '<prefix> &cНе удалось добавить собственное топливо. Причина:
          Это топливо уже существует.'
