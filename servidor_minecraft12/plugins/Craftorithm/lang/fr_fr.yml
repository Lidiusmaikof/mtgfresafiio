prefix: '&8[&3Craftorithm&8]'
unsupported_version: <prefix> Version non prise en charge
new_version: <prefix> &aDétecté une nouvelle version <new_version>, veuillez mettre
  à jour vers la nouvelle version dès que possible!
# 使用命令的一些反馈消息
command:
  no_perm: <prefix> &cVous n'avez pas l'autorisation d'utiliser cette commande.
  player_only: <prefix> &cSeuls les joueurs peuvent exécuter cette commande.
  not_enough_param: <prefix> &cLa commande manque de paramètres, il manque <number>
    paramètre(s).
  undefined_subcmd: <prefix> &cSous-commande non définie!
  item:
    save:
      success: <prefix> &aL'objet a été enregistré avec succès.
      failed_save_air: '<prefix> &cÉchec de l''enregistrement de l''objet, raison
        : impossible d''enregistrer un objet inexistant.'
    give:
      success: <prefix> &aRécupération de l'objet réussie
      not_exist_item: <prefix> &cL'objet <item_name> n'existe pas.
      player_offline: <prefix> &cLe joueur n'est pas en ligne ou n'existe pas.
    fuel:
      add:
        success: <prefix> &aAjouter du carburant personnalisé avec succès.
        failed_add_air: '<prefix> &cL''ajout de carburant personnalisé a échoué. Raison
          : Impossible d''ajouter un élément inexistant comme carburant.'
        failed_exist: '<prefix> &cL''ajout de carburant personnalisé a échoué. Raison
          : Ce carburant existe déjà.'
      remove:
        success: <prefix> &aSupprimer le carburant personnalisé avec succès.
        failed_not_exist: '<prefix> &cLa suppression du carburant personnalisé a échoué.
          Raison : Ce carburant n’existe pas.'
  reload:
    success: <prefix> &aRelance du plugin réussie!
    exception: <prefix> &cUne erreur s'est produite lors du rechargement du plugin,
      veuillez consulter la console.
    recipe_manager_reloading: <prefix> &cLe gestionnaire de recettes est en cours
      de rechargement. Veuillez réessayer plus tard.
  remove:
    success: <prefix> &aRecette supprimée avec succès.
    not_exist: <prefix> &cRecette inexistante.
  disable:
    success: <prefix> &cDésactivation de la recette réussie.
    not_exist: <prefix> &cLa recette n'existe pas ou a déjà été désactivée.
    failed: <prefix> &cÉchec de la désactivation de la recette, elle est peut-être
      déjà désactivée ou n'existe pas.
  version: '<prefix> &aVersion du plugin : <version>'
  create:
    unsupported_recipe_type: <prefix> &cType de recette non pris en charge.
    unsupported_recipe_name: <prefix> &cNom de recette non pris en charge, seules
      les lettres minuscules, les chiffres, '_', '-', et '.' sont autorisés.
    name_used: <prefix> &cL'identifiant de la recette est déjà utilisé.
    null_result: <prefix> &cLe résultat de la recette ne peut pas être vide !
    null_source: <prefix> &cLes ingrédients de la recette ne peuvent pas être vides
      !
    success: <prefix> &aRecette de type <recipe_type> <recipe_name> créée avec succès.
    invalid_recipe_id: <prefix> &cNom de recette non pris en charge. Seules les lettres
      minuscules, les chiffres, "_", "-" et "." sont autorisés.
    input_hint:
      smelting_time: '&aVeuillez entrer le temps de cuisson pour cette recette (tapez
        cancel pour annuler)'
      smelting_exp: '&aVeuillez entrer l''expérience de récompense pour cette recette
        (tapez cancel pour annuler)'
      anvil_cost_level: '&aVeuillez entrer le coût en expérience pour cette recette
        d''enclume (tapez cancel pour annuler)'
  run_arcenciel:
    success: <prefix> &aExécution réussie, durée <time> ms.
  list:
    unsupported_version: <prefix> &cCette fonctionnalité n'est disponible que dans
      la version 1.16 et ultérieure.
  unknown_player: '<prefix> &cJoueur inconnu : <player_name>'
  display:
    unsupported_recipe_type: <prefix> &cType de recette non pris en charge.
  openmenu:
    unknown_menu: '<prefix> &cMenu inconnu : <menu_name>'
  script:
    operation_time: <prefix> &aL'exécution de l'instruction a pris <time> ms.
  edit:
    invalid_recipe_id: <prefix> &cIdentifiant de recette invalide.
    recipe_not_found: <prefix> &cRecette introuvable.
    success: <prefix> &aRecette <recipe_file_name> (<recipe_id>) modifiée avec succès.
  recipebook:
    success: <prefix> &aLivre de recettes ouvert.
    type_not_found: <prefix> &cLe type de recette <recipe_type> n'existe pas
