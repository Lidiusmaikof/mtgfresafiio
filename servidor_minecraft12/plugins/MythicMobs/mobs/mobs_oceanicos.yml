    - skill{s=PresionAbisal} @Target ~onAttack

# =============================================================================
# LA MONTURA: GUARDIÁN ABISAL (PERFECCIONADO)
# =============================================================================
GuardianAbisal:
  Type: GUARDIAN
  Options:
    PreventSunburn: true
    Collidable: false           # Crucial: Evita atascos con el terreno o el jinete
    MovementSpeed: 0.30         # Velocidad óptima de persecución acuática
  AIGoalSelectors:
    - clear
    - float                     # El guardián maneja de forma nativa la física del agua
    - meleeattack
    - wander
  AITargetSelectors:
    - clear
    - players
    - attacker

# =============================================================================
# ENTIDAD DE EFECTOS: VÓRTICE MARINO FIJO (SPAWN MANUAL PERMANENTE)
# =============================================================================
AnclaVisualOceanica:
  Type: ARMOR_STAND
  Options:
    Invisible: true
    Marker: true
    NoGravity: true
    Invulnerable: true
    ForceSpawn: true
    Despawn: false
    Persistent: true
  Skills:
    - skill{s=EfectoSpawnerOceanico} @Self ~onTimer:20